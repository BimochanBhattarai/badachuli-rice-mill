<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Badachuli Rice Mill — brag</title>
<link rel="stylesheet" href="app.css">
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#15110e}
  *{box-sizing:border-box}
  *,*::before,*::after{transition:none!important;animation:none!important}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#15110e;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  #glow{position:absolute;inset:0;background:
    radial-gradient(ellipse 1500px 1000px at 50% 26%, rgba(249,115,22,.13), rgba(249,115,22,0) 68%),
    radial-gradient(ellipse 1100px 700px at 14% 92%, rgba(234,88,12,.07), rgba(0,0,0,0) 70%)}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse 1300px 820px at 50% 46%, rgba(0,0,0,0) 40%, rgba(0,0,0,.58) 100%)}
  .layer{position:absolute;inset:0;pointer-events:none}

  /* ── paper (real .receipt inside) ───────────────────────── */
  .paperwrap{position:absolute;left:50%;top:0;transform-origin:50% 0;will-change:transform,opacity}
  .paper{background:#fff;box-shadow:0 48px 90px -14px rgba(0,0,0,.72), 0 2px 0 rgba(0,0,0,.25);
    position:relative}
  .paper::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:4px;
    background:repeating-linear-gradient(90deg,#fff 0 4px,transparent 4px 8px)}
  .paper::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;
    background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,0))}

  /* ── app window ─────────────────────────────────────────── */
  #win{position:absolute;left:320px;top:10px;width:1280px;height:862px;border-radius:14px;
    overflow:hidden;background:#f2ede8;transform-origin:50% 60%;will-change:transform,opacity;
    box-shadow:0 60px 110px -24px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.07),
      inset 0 1px 0 rgba(255,255,255,.3)}
  #app{width:1280px;height:862px;transform:scale(1);transform-origin:top left}
  #app .app-shell{height:862px}
  #app .sidebar{height:862px;overflow:hidden}
  #app .app-main{height:862px;overflow:hidden}
  #app .sidebar-nav{overflow:hidden}
  .pane{position:absolute;inset:0;padding:1.75rem;will-change:opacity,transform}
  #mainwrap{position:relative;flex:1;background:#f2ede8;overflow:hidden}

  /* ── caption lower third ────────────────────────────────── */
  #scrim{position:absolute;left:0;right:0;bottom:0;height:250px;
    background:linear-gradient(180deg,rgba(21,17,14,0) 0%,rgba(21,17,14,.88) 52%,rgba(21,17,14,.98) 100%)}
  .cap{position:absolute;left:150px;bottom:66px;width:1420px;will-change:opacity,transform}
  .cap .rule{width:52px;height:3px;background:#f97316;border-radius:2px;margin-bottom:20px}
  .cap .line{font-size:46px;line-height:1.16;font-weight:600;color:#f7f3ee;letter-spacing:-.018em}
  .cap .line em{font-style:normal;color:#fb9a4b}

  /* ── brand ──────────────────────────────────────────────── */
  #brand{position:absolute;left:0;right:0;top:50%;text-align:center;will-change:opacity,transform}
  #brand img{width:172px;height:172px;display:block;margin:0 auto 26px;
    filter:drop-shadow(0 14px 34px rgba(0,0,0,.55))}
  #brand .wm{font-size:66px;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1}
  #brand .wmne{font-size:27px;font-weight:600;color:#f97316;margin-top:16px;letter-spacing:.07em}
  #brand .thanks{font-size:30px;font-weight:600;color:#f9a95a;margin-top:26px}
  #brand .sub{font-size:23px;color:#a8a29e;margin-top:14px;letter-spacing:.01em}

  /* offline pill */
  #offpill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
    background:#eef7ee;border:1px solid #cce7cc;color:#2f7a3f;font-size:11px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;will-change:opacity,transform}
  #offpill svg{width:13px;height:13px}

  /* chart */
  .bars{display:flex;align-items:flex-end;gap:26px;height:182px;padding:0 6px 0 2px}
  .barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
  .bar{width:100%;max-width:44px;background:#f97316;border-radius:6px 6px 0 0;will-change:height}
  .barlab{font-size:11px;font-weight:600;color:#a8a29e}
  .gridl{position:absolute;left:8px;right:6px;border-top:1px dashed #f2ede8;z-index:0}
  .bars{position:relative;z-index:1}

  .bill-input--focus{border-color:#f97316!important;box-shadow:0 0 0 3px rgba(249,115,22,.12);background:#fff!important}
  #app .bill-input{line-height:1.35;min-height:35px}
  .caret{display:inline-block;width:1.5px;height:1em;background:#1c1917;vertical-align:-2px;margin-left:1px}
</style>
</head><body>
<div id="stage">
  <div id="glow"></div>
  <div id="vig"></div>

  <!-- ░░ app window ░░ -->
  <div id="win">
    <div id="app"><div class="app-shell">
      <aside class="sidebar" id="sb"></aside>
      <div id="mainwrap">
        <div class="pane" id="dash"></div>
        <div class="pane" id="billpane"></div>
      </div>
    </div></div>
  </div>

  <!-- ░░ receipt (shared markup, two instances) ░░ -->
  <div class="paperwrap" id="paper1"><div class="paper" id="paper1in"></div></div>
  <div class="paperwrap" id="paper2"><div class="paper" id="paper2in"></div></div>

  <div id="scrim"></div>

  <!-- ░░ brand ░░ -->
  <div id="brand">
    <img src="../../resources/logo.svg" alt="">
    <div class="wm">Badachuli Rice Mill</div>
    <div class="wmne">बडचुली राइस मिल</div>
    <div class="thanks" id="thanks">धन्यवाद!</div>
    <div class="sub" id="bsub">Offline-first billing for one rice mill in Nawalpur, Nepal</div>
  </div>

  <!-- ░░ captions ░░ -->
  <div class="cap" id="cap1"><div class="rule"></div><div class="line">This bill was written by hand.</div></div>
  <div class="cap" id="cap3"><div class="rule"></div><div class="line">Replaces the mill's paper ledger.</div></div>
  <div class="cap" id="cap4"><div class="rule"></div><div class="line">Keyboard-first. Type, Enter, done.</div></div>
  <div class="cap" id="cap5"><div class="rule"></div><div class="line">Prints in Nepali. Dates in Bikram Sambat.</div></div>
  <div class="cap" id="cap6"><div class="rule"></div><div class="line">Totals computed from the ledger. Offline.</div></div>
</div>
<script src="icons.js"></script>
<script src="scene.js"></script>
</body></html>
